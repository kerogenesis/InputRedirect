[package]
name = "input-redirect"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Routes the local keyboard, touchpad and mouse through a signed Logitech HID driver"
license = "MIT"
publish = false

[[bin]]
name = "InputRedirect"
path = "src/main.rs"

[dependencies]
bitflags = "2"
bytemuck = { version = "1.25.2", features = ["derive"] }
tempfile = "3"
thiserror = "2"

[dependencies.windows]
version = "0.62"
features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Wdk_System_IO",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RestartManager",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"

# `panic = "abort"` must not be added here, tempting as the smaller binary is:
# the hook callback and the console control handler both catch an unwinding
# panic to leave the keyboard and mouse in a usable state, and aborting would
# skip that together with every destructor - a stuck modifier key survives the
# process.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Groups take a lower priority than the single lints below them, so the
# individual settings win whatever order Cargo reads the table in.
[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Every unsafe block here already says why it is sound. The lint keeps it that
# way: a block without its reasoning is a block nobody can review.
undocumented_unsafe_blocks = "warn"

# The Win32 surface is casts and wide pointers throughout; forbidding them
# would only add noise to calls we cannot write any other way.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"

# Win32 out parameters read better as `&mut value` than `&raw mut value`.
borrow_as_ptr = "allow"

# Counting a few bytes of a report descriptor does not justify a crate.
naive_bytecount = "allow"

# The driver file names are fixed strings we write ourselves.
case_sensitive_file_extension_comparisons = "allow"

# The dashboard really is a handful of independent switches.
struct_excessive_bools = "allow"

# Drawing and locking helpers stay methods so the call sites read as one object
# doing the work, even when they touch no field.
unused_self = "allow"

# Matching on a Result and cleaning up in the error arm is clearer than an
# if-let with a trailing else block.
single_match_else = "allow"
